      <stop offset="0%" stop-color="#004B93" />
      <stop offset="100%" stop-color="#002855" />
    </linearGradient>
    <linearGradient id="skipOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5900" />
      <stop offset="100%" stop-color="#D63A00" />
